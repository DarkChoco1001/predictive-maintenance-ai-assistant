# Production web server: serves the built SPA and proxies /api to the backend.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;                       # don't advertise the nginx version (A05)
    root /usr/share/nginx/html;
    client_max_body_size 16k;                # matches the backend body limit

    # Strict CSP: only our own scripts, styles and API; no inline script, no framing (A03 XSS, A05)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Uncomment when served over HTTPS:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host backend;
        proxy_set_header X-Real-IP $remote_addr;   # overwrites any client-supplied value
        proxy_read_timeout 90s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header in a location replaces the server-level ones, so repeat the security headers
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
